<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Builds</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #020617;
  color: white;
}

.topbar {
  position: relative;
  background: url("brawl-bg.png") center/cover no-repeat;
  padding: 45px 20px;
  text-align: center;
  border-bottom: 5px solid #facc15;
  box-shadow: 0 4px 25px black;
}

.topbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.topbar h1,
.topbar input,
.filters {
  position: relative;
  z-index: 2;
}

.topbar h1 {
  margin: 0;
  font-size: 42px;
  color: #facc15;
  text-shadow: 3px 3px 0 black, 0 0 15px #facc15;
}

#search {
  margin-top: 18px;
  padding: 14px;
  width: 290px;
  border-radius: 14px;
  border: 3px solid #facc15;
  background: rgba(15,23,42,0.9);
  color: white;
  text-align: center;
}

.filters {
  margin-top: 18px;
}

.filters button {
  background: #facc15;
  color: black;
  border: 2px solid black;
  padding: 9px 13px;
  margin: 4px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

.filters button:hover {
  transform: scale(1.07);
}

.section-title {
  margin: 30px 25px 10px;
  color: #facc15;
  font-size: 28px;
  text-shadow: 2px 2px 0 black;
}

.grid {
  padding: 15px 25px 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 22px;
}

.card {
  background: linear-gradient(180deg, #1e293b, #020617);
  padding: 18px;
  border-radius: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  border: 2px solid #0f172a;
}

.card:hover {
  transform: translateY(-6px) scale(1.04);
  box-shadow: 0 0 20px #facc15;
}

.card img {
  width: 135px;
  height: 135px;
  object-fit: contain;
}

.card h3 {
  color: #facc15;
}

.rarity {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 5px;
  font-weight: bold;
}

.rarity-rare { background: #22c55e; }
.rarity-super-rare { background: #2563eb; }
.rarity-epic { background: #8b5cf6; }
.rarity-mythic { background: #ef4444; }
.rarity-legendary { background: #f59e0b; }
.rarity-starting { background: gray; }

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.popup {
  position: relative;
  background: linear-gradient(180deg, #1e293b, #020617);
  border-radius: 22px;
  width: 90%;
  max-width: 460px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 25px;
  text-align: center;
  border: 4px solid #facc15;
}

.close {
  position: absolute;
  top: 10px;
  right: 12px;
  background: red;
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.big { width: 160px; }
.icon { width: 65px; }

.tag {
  display: inline-block;
  background: #334155;
  padding: 8px 12px;
  border-radius: 10px;
  margin: 4px;
}

.build-box {
  background: #0f172a;
  border: 2px solid #334155;
  padding: 12px;
  border-radius: 14px;
  margin: 12px 0;
}
</style>
</head>

<body>

<div class="topbar">
  <h1>Brawl Stars Builds</h1>
  <input id="search" placeholder="Brawler suchen...">

  <div class="filters">
    <button onclick="setFilter('All')">Alle</button>
    <button onclick="setFilter('Starting')">Starting</button>
    <button onclick="setFilter('Rare')">Rare</button>
    <button onclick="setFilter('Super Rare')">Super Rare</button>
    <button onclick="setFilter('Epic')">Epic</button>
    <button onclick="setFilter('Mythic')">Mythic</button>
    <button onclick="setFilter('Legendary')">Legendary</button>
  </div>
</div>

<div id="brawlers"></div>

<div id="modal">
  <div class="popup">
    <button class="close" onclick="closeModal()">X</button>
    <div id="content"></div>
  </div>
</div>

<script>
let brawlers = [];
let activeFilter = "All";

const rarityOrder = ["Starting","Rare","Super Rare","Epic","Mythic","Legendary"];

const customBuilds = {
  "Shelly": {
    gadget: 1,
    starpower: 0,
    gears: ["Damage", "Shield"],
    modes: ["Brawl Ball", "Gem Grab", "Showdown"],
    tip: "Stark gegen Tanks und auf kurzen Maps."
  },
  "Colt": {
    gadget: 1,
    starpower: 1,
    gears: ["Damage", "Reload"],
    modes: ["Heist", "Hot Zone", "Bounty"],
    tip: "Gut auf offenen Maps mit geraden Schusslinien."
  },
  "Spike": {
    gadget: 0,
    starpower: 0,
    gears: ["Damage", "Shield"],
    modes: ["Gem Grab", "Hot Zone", "Brawl Ball"],
    tip: "Sehr gut zum Kontrollieren von Bereichen."
  },
  "Piper": {
    gadget: 1,
    starpower: 1,
    gears: ["Damage", "Shield"],
    modes: ["Knockout", "Bounty", "Wipeout"],
    tip: "Am stärksten auf offenen Maps mit viel Abstand."
  },
  "Leon": {
    gadget: 1,
    starpower: 1,
    gears: ["Damage", "Shield"],
    modes: ["Knockout", "Bounty", "Showdown"],
    tip: "Nutze Unsichtbarkeit für Überraschungsangriffe."
  },
  "Mortis": {
    gadget: 0,
    starpower: 1,
    gears: ["Damage", "Shield"],
    modes: ["Brawl Ball", "Gem Grab", "Knockout"],
    tip: "Greife Werfer und schwache Fernkämpfer an."
  }
};

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {
  brawlers = (data.list || []).sort((a,b) => {
    const diff = rarityOrder.indexOf(a.rarity?.name) - rarityOrder.indexOf(b.rarity?.name);
    if (diff !== 0) return diff;
    return a.name.localeCompare(b.name);
  });

  render(brawlers);
});

function rarityClass(r){
  return "rarity-" + (r?.toLowerCase().replaceAll(" ","-") || "starting");
}

function setFilter(filter) {
  activeFilter = filter;
  applySearchAndFilter();
}

function applySearchAndFilter() {
  const search = document.getElementById("search").value.toLowerCase();

  let list = brawlers.filter(b => b.name.toLowerCase().includes(search));

  if (activeFilter !== "All") {
    list = list.filter(b => b.rarity?.name === activeFilter);
  }

  render(list);
}

function render(list){
  const box = document.getElementById("brawlers");
  box.innerHTML = "";

  rarityOrder.forEach(rarity => {
    const group = list.filter(b => b.rarity?.name === rarity);
    if (group.length === 0) return;

    box.innerHTML += `<h2 class="section-title">${rarity}</h2>`;

    const grid = document.createElement("div");
    grid.className = "grid";

    group.forEach(b => {
      grid.innerHTML += `
        <div class="card" onclick="openBrawler('${b.name}')">
          <img src="${b.imageUrl2 || b.imageUrl}">
          <h3>${b.name}</h3>
          <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>
        </div>
      `;
    });

    box.appendChild(grid);
  });
}

function getBuild(b) {
  const custom = customBuilds[b.name];

  const gadgetIndex = custom?.gadget ?? 0;
  const starpowerIndex = custom?.starpower ?? 0;

  return {
    gadget: b.gadgets?.[gadgetIndex] || b.gadgets?.[0],
    starpower: b.starPowers?.[starpowerIndex] || b.starPowers?.[0],
    gears: custom?.gears || ["Damage", "Shield"],
    modes: custom?.modes || ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: custom?.tip || "Standard-Build. Du kannst später pro Brawler eigene Builds ergänzen."
  };
}

function openBrawler(name){
  const b = brawlers.find(x=>x.name===name);
  if (!b) return;

  const build = getBuild(b);

  document.getElementById("content").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl}" class="big">

    <h2>${b.name}</h2>

    <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>

    <div class="build-box">
      <h3>Bestes Gadget</h3>
      ${build.gadget?.imageUrl ? `<img src="${build.gadget.imageUrl}" class="icon">` : ""}
      <p>${build.gadget?.name || "Kein Gadget gefunden"}</p>
    </div>

    <div class="build-box">
      <h3>Beste Starpower</h3>
      ${build.starpower?.imageUrl ? `<img src="${build.starpower.imageUrl}" class="icon">` : ""}
      <p>${build.starpower?.name || "Keine Starpower gefunden"}</p>
    </div>

    <h3>Empfohlene Gears</h3>
    ${build.gears.map(g => `<span class="tag">${g}</span>`).join("")}

    <h3>Beste Modi</h3>
    ${build.modes.map(m => `<span class="tag">${m}</span>`).join("")}

    <h3>Tipp</h3>
    <p>${build.tip}</p>
  `;

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id==="modal") closeModal();
});

document.getElementById("search").addEventListener("input", applySearchAndFilter);
</script>

</body>
</html>
