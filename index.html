<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brawl Stars Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <button onclick="showPage('brawlers')">Brawler</button>
    <button onclick="showPage('tierlist')">Tierlist</button>
  </div>

  <h1>Brawl Stars Builds</h1>
</header>

<input id="search" type="text" placeholder="Brawler suchen...">

<section id="brawlersPage">
  <div id="brawlerContainer" class="grid"></div>
</section>

<section id="tierlistPage" class="hidden">
  <h2>Tierlist</h2>
  <div id="tierList"></div>
</section>

<!-- 👉 HIER KOMMEN DIE DETAILS (kein Popup mehr) -->
<section id="detailSection" class="hidden">
  <div id="detailContent" class="detail-box"></div>
</section>

<script>
let allBrawlers = [];
let config = {};

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    config = data;
    return fetch(data.dataSource.url);
  })
  .then(res => res.json())
  .then(api => {
    allBrawlers = api.list || [];
    renderBrawlers(allBrawlers);
    renderTierList();
  });

// Seiten wechseln
function showPage(page) {
  document.getElementById("brawlersPage").classList.add("hidden");
  document.getElementById("tierlistPage").classList.add("hidden");

  if (page === "brawlers") {
    document.getElementById("brawlersPage").classList.remove("hidden");
    document.getElementById("search").style.display = "block";
  } else {
    document.getElementById("tierlistPage").classList.remove("hidden");
    document.getElementById("search").style.display = "none";
  }

  document.getElementById("detailSection").classList.add("hidden");
}

// Tier holen
function getTier(name) {
  for (const tier in config.tierList) {
    if (config.tierList[tier].includes(name.toUpperCase())) return tier;
  }
  return "B";
}

// Build holen
function getBestBuild(b) {
  const name = b.name.toUpperCase();

  if (config.bestBuilds && config.bestBuilds[name]) {
    return config.bestBuilds[name];
  }

  return {
    gadget: b.gadgets?.[0]?.name || "Standard",
    starpower: b.starPowers?.[0]?.name || "Standard",
    gears: ["Damage", "Shield"],
    maps: ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: "Automatischer Build."
  };
}

// Brawler anzeigen
function renderBrawlers(list) {
  const container = document.getElementById("brawlerContainer");
  container.innerHTML = "";

  list.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${b.imageUrl}" class="brawler-img">
      <h3>${b.name}</h3>
      <p>Tier: <b>${getTier(b.name)}</b></p>
    `;

    card.onclick = () => openBrawler(b);

    container.appendChild(card);
  });
}

// 👉 KEIN MODAL MEHR → direkt anzeigen
function openBrawler(b) {
  const build = getBestBuild(b);

  document.getElementById("detailContent").innerHTML = `
    <img src="${b.imageUrl}" class="detail-img">
    <h2>${b.name}</h2>

    <p><b>Tier:</b> ${getTier(b.name)}</p>

    <h3>Build</h3>
    <p><b>Gadget:</b> ${build.gadget}</p>
    <p><b>Starpower:</b> ${build.starpower}</p>
    <p><b>Gears:</b> ${build.gears.join(", ")}</p>

    <h3>Maps</h3>
    <ul>
      ${build.maps.map(m => `<li>${m}</li>`).join("")}
    </ul>

    <p>${build.tip}</p>
  `;

  document.getElementById("detailSection").classList.remove("hidden");

  // Scroll runter
  document.getElementById("detailSection").scrollIntoView({
    behavior: "smooth"
  });
}

// Tierlist
function renderTierList() {
  const box = document.getElementById("tierList");
  box.innerHTML = "";

  for (const tier in config.tierList) {
    const row = document.createElement("div");
    row.className = "tier-row";

    row.innerHTML = `
      <div class="tier-name">${tier}</div>
      <div class="tier-brawlers">
        ${config.tierList[tier].map(name =>
          `<span onclick="openByName('${name}')">${name}</span>`
        ).join("")}
      </div>
    `;

    box.appendChild(row);
  }
}

function openByName(name) {
  const b = allBrawlers.find(x => x.name.toUpperCase() === name);
  if (b) openBrawler(b);
}

// Suche
document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();
  const filtered = allBrawlers.filter(b =>
    b.name.toLowerCase().includes(value)
  );
  renderBrawlers(filtered);
});
</script>

</body>
</html>
