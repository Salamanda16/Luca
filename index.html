<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brawl Stars Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <button onclick="showPage('brawlers')">Brawler</button>
    <button onclick="showPage('tierlist')">Tierlist</button>
  </div>
  <h1>Brawl Stars Builds</h1>
</header>

<input id="search" type="text" placeholder="Brawler suchen...">

<section id="brawlersPage">
  <div id="brawlerContainer" class="grid"></div>
</section>

<section id="tierlistPage" class="hidden">
  <h2>Tierlist</h2>
  <div id="tierList"></div>
</section>

<div id="modal" class="hidden">
  <div class="popup">
    <button id="closeBtn">X</button>
    <div id="popupContent"></div>
  </div>
</div>

<script>
let allBrawlers = [];
let config = {};

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    config = data;
    return fetch(config.dataSource.brawlers);
  })
  .then(res => res.json())
  .then(api => {
    const apiBrawlers = api.list || [];

    allBrawlers = apiBrawlers
      .filter(b => !config.blockedBrawlers.includes(b.name.toUpperCase()));

    if (config.extraBrawlers) {
      allBrawlers.push(...config.extraBrawlers);
    }

    renderBrawlers(allBrawlers);
    renderTierList();
  });

function showPage(page) {
  document.getElementById("brawlersPage").classList.add("hidden");
  document.getElementById("tierlistPage").classList.add("hidden");

  if (page === "brawlers") {
    document.getElementById("brawlersPage").classList.remove("hidden");
    document.getElementById("search").style.display = "block";
  } else {
    document.getElementById("tierlistPage").classList.remove("hidden");
    document.getElementById("search").style.display = "none";
  }
}

function getTier(name) {
  const n = name.toUpperCase();

  for (const tier in config.tierList) {
    if (config.tierList[tier].includes(n)) return tier;
  }

  return "B";
}

function getTierOrder(tier) {
  const order = { S: 1, A: 2, B: 3, C: 4, D: 5 };
  return order[tier] || 3;
}

function getBuild(brawler) {
  const name = brawler.name.toUpperCase();
  const custom = config.bestBuilds[name];

  const gadgetIndex = custom?.gadgetIndex ?? 0;
  const starpowerIndex = custom?.starpowerIndex ?? 0;

  const gadget = brawler.gadgets?.[gadgetIndex] || brawler.gadgets?.[0];
  const starpower = brawler.starPowers?.[starpowerIndex] || brawler.starPowers?.[0];

  return {
    gadgetName: gadget?.name || custom?.gadget || "Kein Gadget vorhanden",
    gadgetImage: gadget?.imageUrl || "",
    starpowerName: starpower?.name || custom?.starpower || "Keine Starpower vorhanden",
    starpowerImage: starpower?.imageUrl || "",
    gears: custom?.gears || ["Damage", "Shield"],
    maps: custom?.maps || ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: custom?.tip || "Automatischer Build. Du kannst diesen Brawler später in data.json genauer anpassen."
  };
}

function renderBrawlers(list) {
  const container = document.getElementById("brawlerContainer");
  container.innerHTML = "";

  const sorted = [...list].sort((a, b) => {
    return getTierOrder(getTier(a.name)) - getTierOrder(getTier(b.name));
  });

  sorted.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${b.imageUrl2 || b.imageUrl || ''}" class="brawler-img" alt="${b.name}">
      <h3>${b.name}</h3>
      <span class="tier ${getTier(b.name)}">${getTier(b.name)} Tier</span>
    `;

    card.addEventListener("click", () => openPopup(b));
    container.appendChild(card);
  });
}

function openPopup(brawler) {
  const build = getBuild(brawler);

  document.getElementById("popupContent").innerHTML = `
    <img src="${brawler.imageUrl2 || brawler.imageUrl || ''}" class="detail-img" alt="${brawler.name}">
    <h2>${brawler.name}</h2>

    <p><b>Tier:</b> ${getTier(brawler.name)}</p>
    <p><b>Seltenheit:</b> ${brawler.rarity?.name || "Unbekannt"}</p>
    <p><b>Klasse:</b> ${brawler.class?.name || "Unbekannt"}</p>

    <h3>Bester Build</h3>

    <div class="build-grid">
      <div class="build-card">
        ${build.gadgetImage ? `<img src="${build.gadgetImage}" class="icon">` : ""}
        <h4>Gadget</h4>
        <p>${build.gadgetName}</p>
      </div>

      <div class="build-card">
        ${build.starpowerImage ? `<img src="${build.starpowerImage}" class="icon">` : ""}
        <h4>Starpower</h4>
        <p>${build.starpowerName}</p>
      </div>
    </div>

    <h3>Beste Gears</h3>
    <div>
      ${build.gears.map(g => `<span class="tag">${g}</span>`).join("")}
    </div>

    <h3>Beste Maps / Modi</h3>
    <div class="map-grid">
      ${build.maps.map(m => `
        <div class="map-card">
          <div class="map-icon">🎮</div>
          <p>${m}</p>
        </div>
      `).join("")}
    </div>

    <h3>Tipp</h3>
    <p>${build.tip}</p>
  `;

  document.getElementById("modal").classList.remove("hidden");
}

function closePopup() {
  document.getElementById("modal").classList.add("hidden");
}

document.getElementById("closeBtn").addEventListener("click", closePopup);

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) closePopup();
});

function renderTierList() {
  const box = document.getElementById("tierList");
  box.innerHTML = "";

  for (const tier in config.tierList) {
    const validNames = config.tierList[tier].filter(name =>
      allBrawlers.some(b => b.name.toUpperCase() === name)
    );

    const row = document.createElement("div");
    row.className = `tier-row tier-${tier}`;

    row.innerHTML = `
      <div class="tier-name">${tier}</div>
      <div class="tier-brawlers">
        ${validNames.map(name => `<span onclick="openByName('${name}')">${name}</span>`).join("")}
      </div>
    `;

    box.appendChild(row);
  }
}

function openByName(name) {
  const brawler = allBrawlers.find(b => b.name.toUpperCase() === name);
  if (brawler) openPopup(brawler);
}

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();

  const filtered = allBrawlers.filter(b =>
    b.name.toLowerCase().includes(value)
  );

  renderBrawlers(filtered);
});
</script>

</body>
</html>
