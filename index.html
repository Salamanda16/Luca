<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Builds</title>
<style>
body { background:#0f172a; color:white; font-family:Arial; padding:20px; }
h1 { color:#facc15; }
#search { padding:12px; border-radius:10px; border:none; width:250px; margin-bottom:20px; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.card:hover { transform:scale(1.05); background:#334155; }
.card img { width:120px; height:120px; object-fit:contain; }

#modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup {
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:450px;
  max-height:80vh;
  overflow:auto;
  text-align:center;
  position:relative;
}

.close {
  position:absolute;
  top:10px;
  right:10px;
  background:red;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

.big { width:150px; }
.icon { width:60px; }
.tag {
  display:inline-block;
  background:#334155;
  padding:6px 10px;
  border-radius:8px;
  margin:4px;
}
</style>
</head>
<body>

<h1>Brawl Stars Builds</h1>

<input id="search" placeholder="Brawler suchen...">

<div id="brawlers" class="grid"></div>

<div id="modal">
  <div class="popup">
    <button class="close" onclick="closeModal()">X</button>
    <div id="content"></div>
  </div>
</div>

<script>
let brawlers = [];

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {
  brawlers = data.list || [];
  render(brawlers);
})
.catch(() => {
  document.getElementById("brawlers").innerHTML = "<p>Fehler beim Laden der Brawler.</p>";
});

function render(list) {
  const box = document.getElementById("brawlers");
  box.innerHTML = "";

  list.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${b.imageUrl2 || b.imageUrl || ""}">
      <h3>${b.name}</h3>
      <p>${b.rarity?.name || ""}</p>
    `;

    card.onclick = () => openBrawler(b.name);
    box.appendChild(card);
  });
}

function openBrawler(name) {
  const b = brawlers.find(x => x.name === name);
  if (!b) return;

  const gadget = b.gadgets?.[0];
  const starpower = b.starPowers?.[0];

  document.getElementById("content").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl || ""}" class="big">

    <h2>${b.name}</h2>

    <p><b>Seltenheit:</b> ${b.rarity?.name || "Unbekannt"}</p>
    <p><b>Klasse:</b> ${b.class?.name || "Unbekannt"}</p>

    <h3>Bestes Gadget</h3>
    ${gadget?.imageUrl ? `<img src="${gadget.imageUrl}" class="icon">` : ""}
    <p>${gadget?.name || "Kein Gadget gefunden"}</p>

    <h3>Beste Starpower</h3>
    ${starpower?.imageUrl ? `<img src="${starpower.imageUrl}" class="icon">` : ""}
    <p>${starpower?.name || "Keine Starpower gefunden"}</p>

    <h3>Empfohlene Gears</h3>
    <span class="tag">Damage</span>
    <span class="tag">Shield</span>

    <h3>Beste Modi</h3>
    <span class="tag">Gem Grab</span>
    <span class="tag">Brawl Ball</span>
    <span class="tag">Knockout</span>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();
  render(brawlers.filter(b => b.name.toLowerCase().includes(value)));
});
</script>

</body>
</html>
