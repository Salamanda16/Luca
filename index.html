<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Builds</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #020617;
  color: white;
}

/* TOP BAR MIT BILD */
.topbar {
  position: relative;
  background: url("brawl-bg.png") center/cover no-repeat;
  padding: 45px 20px;
  text-align: center;
  border-bottom: 5px solid #facc15;
  box-shadow: 0 4px 25px black;
}

.topbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
}

.topbar h1,
.topbar input {
  position: relative;
  z-index: 2;
}

.topbar h1 {
  margin: 0;
  font-size: 42px;
  color: #facc15;
  text-shadow: 3px 3px 0 black, 0 0 15px #facc15;
}

#search {
  margin-top: 18px;
  padding: 14px;
  width: 290px;
  border-radius: 14px;
  border: 3px solid #facc15;
  background: rgba(15,23,42,0.9);
  color: white;
  text-align: center;
}

/* GRID */
.grid {
  padding: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 22px;
}

/* CARD */
.card {
  background: linear-gradient(180deg, #1e293b, #020617);
  padding: 18px;
  border-radius: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  border: 2px solid #0f172a;
}

.card:hover {
  transform: translateY(-6px) scale(1.04);
  box-shadow: 0 0 20px #facc15;
}

.card img {
  width: 135px;
  height: 135px;
}

.card h3 {
  color: #facc15;
}

/* RARITY */
.rarity {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 5px;
  font-weight: bold;
}

.rarity-rare { background: #22c55e; }
.rarity-super-rare { background: #2563eb; }
.rarity-epic { background: #8b5cf6; }
.rarity-mythic { background: #ef4444; }
.rarity-legendary { background: #f59e0b; }
.rarity-starting { background: gray; }

/* MODAL */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: none;
  justify-content: center;
  align-items: center;
}

/* POPUP */
.popup {
  position: relative;
  background: linear-gradient(180deg, #1e293b, #020617);
  border-radius: 22px;
  width: 90%;
  max-width: 430px;
  padding: 25px;
  text-align: center;
  border: 4px solid #facc15;
}

.close {
  position: absolute;
  top: 10px;
  right: 12px;
  background: red;
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.big { width: 160px; }
.icon { width: 65px; }

.tag {
  display: inline-block;
  background: #334155;
  padding: 8px 12px;
  border-radius: 10px;
  margin: 4px;
}
</style>
</head>

<body>

<div class="topbar">
  <h1>Brawl Stars Builds</h1>
  <input id="search" placeholder="Brawler suchen...">
</div>

<div id="brawlers" class="grid"></div>

<div id="modal">
  <div class="popup">
    <button class="close" onclick="closeModal()">X</button>
    <div id="content"></div>
  </div>
</div>

<script>
let brawlers = [];

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {

  // 🔥 SORTIERUNG NACH RARITY
  const order = ["Starting","Rare","Super Rare","Epic","Mythic","Legendary"];

  brawlers = (data.list || []).sort((a,b)=>{
    const diff = order.indexOf(a.rarity?.name) - order.indexOf(b.rarity?.name);
    if(diff !== 0) return diff;
    return a.name.localeCompare(b.name);
  });

  render(brawlers);
});

function rarityClass(r){
  return "rarity-" + (r?.toLowerCase().replaceAll(" ","-") || "starting");
}

function render(list){
  const box = document.getElementById("brawlers");
  box.innerHTML = "";

  list.forEach(b=>{
    box.innerHTML += `
      <div class="card" onclick="openBrawler('${b.name}')">
        <img src="${b.imageUrl2 || b.imageUrl}">
        <h3>${b.name}</h3>
        <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>
      </div>
    `;
  });
}

function openBrawler(name){
  const b = brawlers.find(x=>x.name===name);

  const gadget = b.gadgets?.[0];
  const star = b.starPowers?.[0];

  document.getElementById("content").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl}" class="big">

    <h2>${b.name}</h2>

    <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>

    <h3>Gadget</h3>
    <img src="${gadget?.imageUrl || ""}" class="icon">
    <p>${gadget?.name || ""}</p>

    <h3>Starpower</h3>
    <img src="${star?.imageUrl || ""}" class="icon">
    <p>${star?.name || ""}</p>

    <h3>Beste Modi</h3>
    <span class="tag">Gem Grab</span>
    <span class="tag">Brawl Ball</span>
    <span class="tag">Knockout</span>
  `;

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id==="modal") closeModal();
});

document.getElementById("search").addEventListener("input", e=>{
  const v = e.target.value.toLowerCase();
  render(brawlers.filter(b=>b.name.toLowerCase().includes(v)));
});
</script>

</body>
</html>
