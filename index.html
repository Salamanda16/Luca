<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Builds</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #020617 65%);
  color: white;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 10px;
  color: #facc15;
  text-shadow: 3px 3px 0 #000, 0 0 18px #facc15;
}

#search {
  display: block;
  margin: 28px auto;
  padding: 15px;
  width: 280px;
  border-radius: 16px;
  border: 3px solid #facc15;
  background: #0f172a;
  color: white;
  text-align: center;
  font-size: 16px;
  box-shadow: 0 6px 0 #000;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 22px;
}

.card {
  background: linear-gradient(180deg, #334155, #111827);
  padding: 18px;
  border-radius: 22px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  border: 3px solid #020617;
  box-shadow: 0 8px 0 #020617, 0 0 18px rgba(0,0,0,0.7);
}

.card:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 12px 0 #020617, 0 0 25px #facc15;
}

.card img {
  width: 145px;
  height: 145px;
  object-fit: contain;
}

.card h3 {
  color: #facc15;
  font-size: 22px;
  text-shadow: 2px 2px 0 #000;
}

.rarity {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 12px;
  font-weight: bold;
  color: white;
  box-shadow: 0 4px 0 rgba(0,0,0,0.4);
}

.rarity-rare { background: #22c55e; }
.rarity-super-rare { background: #2563eb; }
.rarity-epic { background: #8b5cf6; }
.rarity-mythic { background: #ef4444; }
.rarity-legendary { background: #f59e0b; }
.rarity-ultra-legendary { background: #ec4899; }
.rarity-starting { background: #64748b; }

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.popup {
  background: linear-gradient(180deg, #1e293b, #020617);
  padding: 28px;
  border-radius: 26px;
  width: 90%;
  max-width: 460px;
  max-height: 85vh;
  overflow-y: auto;
  text-align: center;
  position: relative;
  border: 4px solid #facc15;
  box-shadow: 0 0 35px black;
  animation: pop 0.22s ease;
}

.close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: #ef4444;
  border: 3px solid #7f1d1d;
  color: white;
  padding: 8px 13px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
}

.big {
  width: 170px;
  margin-bottom: 10px;
}

.icon {
  width: 65px;
}

.tag {
  display: inline-block;
  background: #334155;
  padding: 9px 13px;
  border-radius: 12px;
  margin: 5px;
  border: 2px solid #475569;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}
</style>
</head>

<body>

<h1>Brawl Stars Builds</h1>

<input id="search" placeholder="Brawler suchen...">

<div id="brawlers" class="grid"></div>

<div id="modal">
  <div class="popup">
    <button class="close" onclick="closeModal()">X</button>
    <div id="content"></div>
  </div>
</div>

<script>
let brawlers = [];

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {
  brawlers = data.list || [];
  render(brawlers);
})
.catch(() => {
  document.getElementById("brawlers").innerHTML = "<p>Fehler beim Laden der Brawler.</p>";
});

function rarityClass(rarity) {
  if (!rarity) return "rarity-starting";

  return "rarity-" + rarity
    .toLowerCase()
    .replaceAll(" ", "-");
}

function render(list) {
  const box = document.getElementById("brawlers");
  box.innerHTML = "";

  list.forEach(b => {
    const rarity = b.rarity?.name || "Unbekannt";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${b.imageUrl2 || b.imageUrl || ""}">
      <h3>${b.name}</h3>
      <span class="rarity ${rarityClass(rarity)}">${rarity}</span>
    `;

    card.onclick = () => openBrawler(b.name);
    box.appendChild(card);
  });
}

function openBrawler(name) {
  const b = brawlers.find(x => x.name === name);
  if (!b) return;

  const gadget = b.gadgets?.[0];
  const starpower = b.starPowers?.[0];
  const rarity = b.rarity?.name || "Unbekannt";

  document.getElementById("content").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl || ""}" class="big">

    <h2>${b.name}</h2>

    <p>
      <b>Seltenheit:</b><br>
      <span class="rarity ${rarityClass(rarity)}">${rarity}</span>
    </p>

    <h3>Bestes Gadget</h3>
    ${gadget?.imageUrl ? `<img src="${gadget.imageUrl}" class="icon">` : ""}
    <p>${gadget?.name || "Kein Gadget gefunden"}</p>

    <h3>Beste Starpower</h3>
    ${starpower?.imageUrl ? `<img src="${starpower.imageUrl}" class="icon">` : ""}
    <p>${starpower?.name || "Keine Starpower gefunden"}</p>

    <h3>Empfohlene Gears</h3>
    <span class="tag">Damage</span>
    <span class="tag">Shield</span>

    <h3>Beste Modi</h3>
    <span class="tag">Gem Grab</span>
    <span class="tag">Brawl Ball</span>
    <span class="tag">Knockout</span>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();
  render(brawlers.filter(b => b.name.toLowerCase().includes(value)));
});
</script>

</body>
</html>
