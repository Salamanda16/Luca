<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brawl Stars Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <button onclick="showPage('brawlers')">Brawler</button>
    <button onclick="showPage('tierlist')">Tierlist</button>
  </div>

  <h1>Brawl Stars Builds</h1>
</header>

<input id="search" type="text" placeholder="Brawler suchen...">

<section id="brawlersPage">
  <div id="brawlerContainer" class="grid"></div>
</section>

<section id="tierlistPage" class="hidden">
  <h2>Tierlist</h2>
  <div id="tierList"></div>
</section>

<div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <button id="closeBtn" class="close">X</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
let allBrawlers = [];
let config = {};

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    config = data;

    return fetch(data.dataSource.url);
  })
  .then(res => res.json())
  .then(api => {
    allBrawlers = api.list || [];
    renderBrawlers(allBrawlers);
    renderTierList();
  })
  .catch(error => {
    console.error("Fehler:", error);
    document.getElementById("brawlerContainer").innerHTML =
      "<p>Fehler beim Laden der Brawler.</p>";
  });

function showPage(page) {
  document.getElementById("brawlersPage").classList.add("hidden");
  document.getElementById("tierlistPage").classList.add("hidden");

  if (page === "brawlers") {
    document.getElementById("brawlersPage").classList.remove("hidden");
    document.getElementById("search").style.display = "block";
  }

  if (page === "tierlist") {
    document.getElementById("tierlistPage").classList.remove("hidden");
    document.getElementById("search").style.display = "none";
  }
}

function getTier(name) {
  const upperName = name.toUpperCase();

  for (const tier in config.tierList) {
    if (config.tierList[tier].includes(upperName)) {
      return tier;
    }
  }

  return "B";
}

function getBestBuild(brawler) {
  const upperName = brawler.name.toUpperCase();

  if (config.bestBuilds && config.bestBuilds[upperName]) {
    return config.bestBuilds[upperName];
  }

  return {
    gadget: brawler.gadgets?.[0]?.name || "Kein Gadget gefunden",
    starpower: brawler.starPowers?.[0]?.name || "Keine Starpower gefunden",
    gears: ["Damage", "Shield"],
    maps: ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: "Automatischer Build. Du kannst diesen Brawler später in der data.json genauer anpassen."
  };
}

function renderBrawlers(list) {
  const container = document.getElementById("brawlerContainer");
  container.innerHTML = "";

  list.forEach(brawler => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${brawler.imageUrl}" class="brawler-img" alt="${brawler.name}">
      <h3>${brawler.name}</h3>
      <p>Tier: <b>${getTier(brawler.name)}</b></p>
      <p>${brawler.rarity?.name || ""}</p>
    `;

    card.addEventListener("click", () => {
      openBrawler(brawler);
    });

    container.appendChild(card);
  });
}

function openBrawler(brawler) {
  const build = getBestBuild(brawler);

  document.getElementById("detailContent").innerHTML = `
    <img src="${brawler.imageUrl}" class="detail-img" alt="${brawler.name}">
    <h2>${brawler.name}</h2>

    <p><b>Tier:</b> ${getTier(brawler.name)}</p>
    <p><b>Seltenheit:</b> ${brawler.rarity?.name || "Unbekannt"}</p>
    <p><b>Klasse:</b> ${brawler.class?.name || "Unbekannt"}</p>

    <h3>Bester Build</h3>
    <p><b>Gadget:</b> ${build.gadget}</p>
    <p><b>Starpower:</b> ${build.starpower}</p>
    <p><b>Gears:</b> ${build.gears.join(", ")}</p>

    <h3>Beste Maps / Modi</h3>
    <ul>
      ${build.maps.map(map => `<li>${map}</li>`).join("")}
    </ul>

    <h3>Tipp</h3>
    <p>${build.tip}</p>
  `;

  document.getElementById("detailModal").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("detailModal").classList.add("hidden");
}

document.getElementById("closeBtn").addEventListener("click", function(event) {
  event.stopPropagation();
  closeModal();
});

document.getElementById("detailModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeModal();
  }
});

function renderTierList() {
  const box = document.getElementById("tierList");
  box.innerHTML = "";

  for (const tier in config.tierList) {
    const row = document.createElement("div");
    row.className = "tier-row";

    row.innerHTML = `
      <div class="tier-name">${tier}</div>
      <div class="tier-brawlers">
        ${config.tierList[tier].map(name => `<span onclick="openBrawlerByName('${name}')">${name}</span>`).join("")}
      </div>
    `;

    box.appendChild(row);
  }
}

function openBrawlerByName(name) {
  const brawler = allBrawlers.find(b => b.name.toUpperCase() === name.toUpperCase());

  if (brawler) {
    openBrawler(brawler);
  }
}

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();

  const filtered = allBrawlers.filter(brawler =>
    brawler.name.toLowerCase().includes(value)
  );

  renderBrawlers(filtered);
});
</script>

</body>
</html>
