<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brawl Stars Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav>
    <button onclick="showPage('brawlers')">Brawler</button>
    <button onclick="showPage('tierlist')">Tierlist</button>
  </nav>
  <h1>Brawl Stars Builds</h1>
</header>

<input id="search" placeholder="Brawler suchen...">

<section id="brawlersPage">
  <div class="grid" id="brawlerContainer"></div>
</section>

<section id="tierlistPage" class="hidden">
  <h2>Tierlist</h2>
  <div id="tierList"></div>
</section>

<div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">X</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
let allBrawlers = [];
let config = {};

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    config = data;

    fetch(data.dataSource.url)
      .then(res => res.json())
      .then(api => {
        allBrawlers = api.list || [];
        renderBrawlers(allBrawlers);
        renderTierList();
      });
  });

function showPage(page) {
  document.getElementById("brawlersPage").classList.add("hidden");
  document.getElementById("tierlistPage").classList.add("hidden");

  if (page === "brawlers") {
    document.getElementById("brawlersPage").classList.remove("hidden");
    document.getElementById("search").style.display = "block";
  } else {
    document.getElementById("tierlistPage").classList.remove("hidden");
    document.getElementById("search").style.display = "none";
  }
}

function getTier(name) {
  for (const tier in config.tierList) {
    if (config.tierList[tier].includes(name.toUpperCase())) return tier;
  }
  return "Nicht bewertet";
}

function getBestBuild(brawler) {
  const name = brawler.name.toUpperCase();
  const custom = config.bestBuilds[name];

  if (custom) return custom;

  return {
    gadget: brawler.gadgets?.[0]?.name || "Automatisch: bestes verfügbares Gadget",
    starpower: brawler.starPowers?.[0]?.name || "Automatisch: beste verfügbare Starpower",
    gears: ["Damage", "Shield"],
    maps: ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: "Automatischer Build. Du kannst diesen Brawler später in bestBuilds genauer anpassen."
  };
}

function renderBrawlers(list) {
  const container = document.getElementById("brawlerContainer");
  container.innerHTML = "";

  list.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openBrawler(b);

    card.innerHTML = `
      <img src="${b.imageUrl}" class="brawler-img" alt="${b.name}">
      <h3>${b.name}</h3>
      <p>Tier: <b>${getTier(b.name)}</b></p>
      <p>${b.rarity?.name || ""}</p>
    `;

    container.appendChild(card);
  });
}

function openBrawler(b) {
  const build = getBestBuild(b);

  document.getElementById("detailContent").innerHTML = `
    <img src="${b.imageUrl}" class="detail-img" alt="${b.name}">
    <h2>${b.name}</h2>

    <p><b>Tier:</b> ${getTier(b.name)}</p>
    <p><b>Seltenheit:</b> ${b.rarity?.name || "Unbekannt"}</p>
    <p><b>Klasse:</b> ${b.class?.name || "Unbekannt"}</p>

    <h3>Bester Build</h3>
    <p><b>Gadget:</b> ${build.gadget}</p>
    <p><b>Starpower:</b> ${build.starpower}</p>
    <p><b>Gears:</b> ${build.gears.join(", ")}</p>

    <h3>Beste Maps / Modi</h3>
    <ul>
      ${build.maps.map(map => `<li>${map}</li>`).join("")}
    </ul>

    <h3>Tipp</h3>
    <p>${build.tip}</p>
  `;

  document.getElementById("detailModal").classList.remove("hidden");
}

function closeModal() {
  const modal = document.getElementById("detailModal");
  modal.classList.add("hidden");
}

function renderTierList() {
  const box = document.getElementById("tierList");
  box.innerHTML = "";

  for (const tier in config.tierList) {
    const row = document.createElement("div");
    row.className = "tier-row";

    row.innerHTML = `
      <div class="tier-name">${tier}</div>
      <div class="tier-brawlers">
        ${config.tierList[tier].map(name => {
          const b = allBrawlers.find(x => x.name.toUpperCase() === name);
          return `<span onclick="openBrawlerByName('${name}')">${b ? b.name : name}</span>`;
        }).join("")}
      </div>
    `;

    box.appendChild(row);
  }
}

function openBrawlerByName(name) {
  const brawler = allBrawlers.find(b => b.name.toUpperCase() === name);
  if (brawler) openBrawler(brawler);
}

document.getElementById("search").addEventListener("input", e => {
  const value = e.target.value.toLowerCase();
  renderBrawlers(allBrawlers.filter(b => b.name.toLowerCase().includes(value)));
});
</script>

</body>
</html>
