<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Builds</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #020617;
  color: white;
}

/* 🔥 TOP BAR */
.topbar {
  background: linear-gradient(135deg, #1e3a8a, #9333ea);
  padding: 20px;
  text-align: center;
  border-bottom: 4px solid #facc15;
  box-shadow: 0 4px 20px black;
}

.topbar h1 {
  margin: 0;
  font-size: 36px;
  color: #facc15;
  text-shadow: 2px 2px 0 black, 0 0 10px #facc15;
}

/* SEARCH */
#search {
  margin-top: 15px;
  padding: 14px;
  width: 280px;
  border-radius: 14px;
  border: none;
  background: #0f172a;
  color: white;
  text-align: center;
  box-shadow: 0 4px 0 black;
}

/* GRID */
.grid {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: linear-gradient(180deg, #1e293b, #020617);
  padding: 15px;
  border-radius: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  border: 2px solid #0f172a;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #facc15;
}

.card img {
  width: 130px;
  height: 130px;
}

/* RARITY */
.rarity {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 5px;
  font-weight: bold;
}

.rarity-rare { background: #22c55e; }
.rarity-super-rare { background: #2563eb; }
.rarity-epic { background: #8b5cf6; }
.rarity-mythic { background: #ef4444; }
.rarity-legendary { background: #f59e0b; }
.rarity-starting { background: gray; }

/* 🔥 MODAL */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

/* 🔥 POPUP */
.popup {
  background: #0f172a;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  padding: 20px;
  text-align: center;
  animation: pop 0.2s ease;
  border: 3px solid #facc15;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  background: red;
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.big { width: 150px; }
.icon { width: 60px; }

.tag {
  display: inline-block;
  background: #334155;
  padding: 8px;
  border-radius: 10px;
  margin: 4px;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="topbar">
  <h1>Brawl Stars Builds</h1>
  <input id="search" placeholder="Brawler suchen...">
</div>

<div id="brawlers" class="grid"></div>

<div id="modal">
  <div class="popup">
    <button class="close" onclick="closeModal()">X</button>
    <div id="content"></div>
  </div>
</div>

<script>
let brawlers = [];

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {
  brawlers = data.list;
  render(brawlers);
});

function rarityClass(r){
  return "rarity-" + (r?.toLowerCase().replace(" ","-") || "starting");
}

function render(list){
  const box = document.getElementById("brawlers");
  box.innerHTML = "";

  list.forEach(b=>{
    box.innerHTML += `
      <div class="card" onclick="openBrawler('${b.name}')">
        <img src="${b.imageUrl2 || b.imageUrl}">
        <h3>${b.name}</h3>
        <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>
      </div>
    `;
  });
}

function openBrawler(name){
  const b = brawlers.find(x=>x.name===name);

  const gadget = b.gadgets?.[0];
  const star = b.starPowers?.[0];

  document.getElementById("content").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl}" class="big">

    <h2>${b.name}</h2>

    <span class="rarity ${rarityClass(b.rarity?.name)}">${b.rarity?.name}</span>

    <h3>Gadget</h3>
    <img src="${gadget?.imageUrl || ""}" class="icon">
    <p>${gadget?.name || ""}</p>

    <h3>Starpower</h3>
    <img src="${star?.imageUrl || ""}" class="icon">
    <p>${star?.name || ""}</p>

    <h3>Beste Modi</h3>
    <span class="tag">Gem Grab</span>
    <span class="tag">Brawl Ball</span>
    <span class="tag">Knockout</span>
  `;

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id==="modal") closeModal();
});

document.getElementById("search").addEventListener("input", e=>{
  const v = e.target.value.toLowerCase();
  render(brawlers.filter(b=>b.name.toLowerCase().includes(v)));
});
</script>

</body>
</html>
