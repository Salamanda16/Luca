<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brawl Stars Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <button onclick="showPage('brawlers')">Brawler</button>
    <button onclick="showPage('tierlist')">Tierlist</button>
  </div>

  <h1>Brawl Stars Builds</h1>
</header>

<input id="search" type="text" placeholder="Brawler suchen...">

<section id="brawlersPage">
  <div id="brawlerContainer" class="grid"></div>
</section>

<section id="tierlistPage" class="hidden">
  <h2>Tierlist</h2>
  <div id="tierList"></div>
</section>

<section id="detailSection" class="hidden">
  <div id="detailContent" class="detail-box"></div>
</section>

<script>
let allBrawlers = [];
let allMaps = [];
let config = {};

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    config = data;

    return Promise.all([
      fetch(data.dataSource.brawlers).then(res => res.json()),
      fetch(data.dataSource.maps).then(res => res.json()).catch(() => ({ list: [] }))
    ]);
  })
  .then(([brawlerApi, mapApi]) => {
    const apiBrawlers = brawlerApi.list || [];
    const extraBrawlers = config.extraBrawlers || [];

    allBrawlers = [...apiBrawlers, ...extraBrawlers].filter(b => {
      return !config.removedBrawlers.includes(b.name.toUpperCase());
    });

    allMaps = mapApi.list || [];

    renderBrawlers(allBrawlers);
    renderTierList();
  });

function showPage(page) {
  document.getElementById("brawlersPage").classList.add("hidden");
  document.getElementById("tierlistPage").classList.add("hidden");
  document.getElementById("detailSection").classList.add("hidden");

  if (page === "brawlers") {
    document.getElementById("brawlersPage").classList.remove("hidden");
    document.getElementById("search").style.display = "block";
  } else {
    document.getElementById("tierlistPage").classList.remove("hidden");
    document.getElementById("search").style.display = "none";
  }
}

function getTier(name) {
  const upperName = name.toUpperCase();

  for (const tier in config.tierList) {
    if (config.tierList[tier].includes(upperName)) {
      return tier;
    }
  }

  return "B";
}

function getBestBuild(brawler) {
  const name = brawler.name.toUpperCase();

  if (config.bestBuilds[name]) {
    return config.bestBuilds[name];
  }

  return {
    gadget: brawler.gadgets?.[0]?.name || "Bestes Gadget automatisch",
    starpower: brawler.starPowers?.[0]?.name || "Beste Starpower automatisch",
    gears: ["Damage", "Shield"],
    maps: ["Gem Grab", "Brawl Ball", "Knockout"],
    tip: "Automatischer Build. Du kannst ihn später in data.json verbessern."
  };
}

function getGadgetImage(brawler, gadgetName) {
  const gadget = brawler.gadgets?.find(g => g.name === gadgetName);
  return gadget?.imageUrl || "";
}

function getStarpowerImage(brawler, starpowerName) {
  const starpower = brawler.starPowers?.find(s => s.name === starpowerName);
  return starpower?.imageUrl || "";
}

function getMapImage(mapName) {
  const map = allMaps.find(m => m.name === mapName);
  return map?.imageUrl || "";
}

function renderBrawlers(list) {
  const container = document.getElementById("brawlerContainer");
  container.innerHTML = "";

  const sorted = list.sort((a, b) => {
    const order = { "S": 1, "A": 2, "B": 3, "C": 4, "D": 5 };
    return order[getTier(a.name)] - order[getTier(b.name)];
  });

  sorted.forEach(b => {
    const card = document.createElement("div");
    card.className = "card fade-in";

    card.innerHTML = `
      <img src="${b.imageUrl || ""}" class="brawler-img" alt="${b.name}">
      <h3>${b.name}</h3>
      <p class="tier-badge ${getTier(b.name)}">${getTier(b.name)} Tier</p>
    `;

    card.onclick = () => openBrawler(b);
    container.appendChild(card);
  });
}

function openBrawler(b) {
  const build = getBestBuild(b);

  const gadgetImg = getGadgetImage(b, build.gadget);
  const starpowerImg = getStarpowerImage(b, build.starpower);

  document.getElementById("detailContent").innerHTML = `
    <img src="${b.imageUrl || ""}" class="detail-img" alt="${b.name}">
    <h2>${b.name}</h2>

    <p><b>Tier:</b> ${getTier(b.name)}</p>

    <h3>Bester Build</h3>

    <div class="build-row">
      <div class="build-card">
        ${gadgetImg ? `<img src="${gadgetImg}" class="small-icon">` : ""}
        <b>Gadget</b>
        <p>${build.gadget}</p>
      </div>

      <div class="build-card">
        ${starpowerImg ? `<img src="${starpowerImg}" class="small-icon">` : ""}
        <b>Starpower</b>
        <p>${build.starpower}</p>
      </div>
    </div>

    <h3>Beste Gears</h3>
    <div>
      ${build.gears.map(g => `<span class="tag">${g}</span>`).join("")}
    </div>

    <h3>Beste Maps / Modi</h3>
    <div class="map-grid">
      ${build.maps.map(map => `
        <div class="map-card">
          ${getMapImage(map) ? `<img src="${getMapImage(map)}" class="map-img">` : ""}
          <p>${map}</p>
        </div>
      `).join("")}
    </div>

    <h3>Tipp</h3>
    <p>${build.tip}</p>
  `;

  document.getElementById("detailSection").classList.remove("hidden");
  document.getElementById("detailSection").scrollIntoView({ behavior: "smooth" });
}

function renderTierList() {
  const box = document.getElementById("tierList");
  box.innerHTML = "";

  for (const tier in config.tierList) {
    const row = document.createElement("div");
    row.className = `tier-row tier-${tier}`;

    row.innerHTML = `
      <div class="tier-name">${tier}</div>
      <div class="tier-brawlers">
        ${config.tierList[tier].map(name =>
          `<span onclick="openByName('${name}')">${name}</span>`
        ).join("")}
      </div>
    `;

    box.appendChild(row);
  }
}

function openByName(name) {
  const b = allBrawlers.find(x => x.name.toUpperCase() === name.toUpperCase());
  if (b) {
    openBrawler(b);
  }
}

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();

  const filtered = allBrawlers.filter(b =>
    b.name.toLowerCase().includes(value)
  );

  renderBrawlers(filtered);
});
</script>

</body>
</html>
