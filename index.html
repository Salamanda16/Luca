<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brawl Stars Pro Builds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Brawl Stars Pro Builds</h1>
</header>

<input id="search" placeholder="Brawler suchen...">

<div id="brawlerContainer" class="grid"></div>

<h2>Beste Brawler für Modi</h2>
<div id="modeMeta"></div>

<div id="modal" class="hidden">
  <div class="popup">
    <button onclick="closePopup()">X</button>
    <div id="popupContent"></div>
  </div>
</div>

<script>
let brawlers = [];

fetch("https://api.brawlapi.com/v1/brawlers")
.then(res => res.json())
.then(data => {
  brawlers = data.list;
  render(brawlers);
  renderModeMeta();
});

function render(list){
  const c = document.getElementById("brawlerContainer");
  c.innerHTML = "";

  list.forEach(b => {
    c.innerHTML += `
      <div class="card" onclick="openBrawler('${b.name}')">
        <img src="${b.imageUrl2 || b.imageUrl || ''}">
        <h3>${b.name}</h3>
      </div>
    `;
  });
}

function openBrawler(name){
  const b = brawlers.find(x => x.name === name);

  const gadget = b.gadgets?.[0];
  const star = b.starPowers?.[0];

  document.getElementById("popupContent").innerHTML = `
    <img src="${b.imageUrl2 || b.imageUrl || ''}" class="big">

    <h2>${b.name}</h2>

    <h3>Dein Build (simuliert)</h3>

    <label>Power Level:</label>
    <select id="power">
      <option>7</option>
      <option>9</option>
      <option>11</option>
    </select>

    <h3>Gadget</h3>
    <img src="${gadget?.imageUrl || ''}" class="icon">
    <p>${gadget?.name || "Keins"}</p>

    <h3>Starpower</h3>
    <img src="${star?.imageUrl || ''}" class="icon">
    <p>${star?.name || "Keine"}</p>

    <h3>Beste Modi</h3>
    <div class="modes">
      ${bestModes(b).map(m => `
        <div class="mode">
          ${getModeLogo(m)}
          <p>${m}</p>
        </div>
      `).join("")}
    </div>
  `;

  document.getElementById("modal").classList.remove("hidden");
}

function closePopup(){
  document.getElementById("modal").classList.add("hidden");
}

function getModeLogo(mode){
  const icons = {
    "Gem Grab": "💎",
    "Brawl Ball": "⚽",
    "Knockout": "💀",
    "Heist": "💰",
    "Hot Zone": "🔥",
    "Showdown": "👑"
  };

  return `<div class="emoji">${icons[mode] || "🎮"}</div>`;
}

function bestModes(b){
  if(b.class?.name === "Damage Dealer") return ["Brawl Ball","Gem Grab"];
  if(b.class?.name === "Marksman") return ["Bounty","Knockout"];
  if(b.class?.name === "Tank") return ["Brawl Ball","Hot Zone"];
  return ["Gem Grab","Showdown"];
}

function renderModeMeta(){
  const box = document.getElementById("modeMeta");

  const modes = ["Gem Grab","Brawl Ball","Knockout"];

  box.innerHTML = modes.map(mode => `
    <div class="meta-box">
      <h3>${mode}</h3>
      ${brawlers.slice(0,6).map(b => `
        <span>${b.name}</span>
      `).join("")}
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input", e=>{
  const v = e.target.value.toLowerCase();
  render(brawlers.filter(b=>b.name.toLowerCase().includes(v)));
});
</script>

</body>
</html>
